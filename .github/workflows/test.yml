name: CI
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Run a multi-line script
        run: |
          sudo snap install microceph
          microceph cluster bootstrap
          microceph disk add loop,4G,3
          microceph enable rgw
          microceph status
          radosgw-admin user create --uid=osnadmin --display-name="osnadmin" --access-key="osnadmindev" --secret="osnadmindevsecret"
          radosgw-admin caps add --uid=osnadmin --caps="buckets=read;metadata=read;usage=read;users=*"
          radosgw-admin quota enable --quota-scope=bucket --uid=osnadmin
