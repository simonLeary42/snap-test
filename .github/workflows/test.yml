name: CI
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Run a multi-line script
        run: |
          set -euo pipefail
          set -x
          trap 's=$?; echo >&2 "$0: Error on line "$LINENO": $BASH_COMMAND"; exit $s' ERR
          sudo snap install microceph
          sudo microceph cluster bootstrap
          sudo microceph disk add loop,4G,3
          sudo microceph enable rgw
          sudo microceph status
          sudo radosgw-admin user create --uid=osnadmin --display-name="osnadmin" --access-key="osnadmindev" --secret="osnadmindevsecret"
          sudo radosgw-admin caps add --uid=osnadmin --caps="buckets=read;metadata=read;usage=read;users=*"
          sudo radosgw-admin quota enable --quota-scope=bucket --uid=osnadmin
